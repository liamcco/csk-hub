# The deployed CSK Hub stack: PostgreSQL, Redis, a one-shot migration job and the app, all from
# one release image. Configuration comes from stack.env (see stack.env.example and README.md).
#
# migrate applies pending migrations and exits; app starts only after it exits successfully, so
# a failed migration leaves the previous release stopped rather than running on a schema it
# does not expect.

x-release-image: &release-image ${CSK_HUB_IMAGE:?Set CSK_HUB_IMAGE to the published image, ideally pinned by digest}

x-database-url: &database-url postgresql://csk_hub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/csk_hub?sslmode=disable

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: csk_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: csk_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csk_hub -d csk_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: *release-image
    command: ["bun", "cli.js", "migrate"]
    restart: "no"
    environment:
      POSTGRES_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    image: *release-image
    restart: unless-stopped
    environment:
      POSTGRES_URL: *database-url
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-csk-hub}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL to the public origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      EMAIL_MODE: ${EMAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Set VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Set VAPID_PRIVATE_KEY}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-webmaster@choir.chs.chalmers.se}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  # Persistent, but not a backup: see "Backups" in README.md.
  postgres_data:
  redis_data:
