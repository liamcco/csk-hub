# Local development services: PostgreSQL on localhost:5433 and Redis on localhost:6379.
#   docker compose -f deploy/compose.dev.yml up -d
# The project name keeps the volumes the old root docker-compose.yml created, so moving the file
# here does not lose local data.
name: csk-hub

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: csk_hub
      POSTGRES_PASSWORD: csk_hub
      POSTGRES_DB: csk_hub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
